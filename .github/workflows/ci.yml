name: CI
on: [push, pull_request]

jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, cc: gcc, cxx: g++}
          - {os: ubuntu-24.04, cc: clang, cxx: clang++}
          - {os: ubuntu-22.04, cc: gcc, cxx: g++}
          - {os: ubuntu-24.04-arm, cc: gcc, cxx: g++}
          - {os: ubuntu-24.04-arm, cc: clang, cxx: clang++}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCORUNDUM_WERROR=ON
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Benchmark (shared VM, informational)
        run: ./build/corundum-bench all -n 200000 -c 0,1
      - name: Install and consume as a CMake package
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/prefix"
          mkdir -p "$RUNNER_TEMP/consumer"
          cat > "$RUNNER_TEMP/consumer/CMakeLists.txt" <<'EOF'
          cmake_minimum_required(VERSION 3.16)
          project(consumer C CXX)
          find_package(Corundum REQUIRED)
          add_executable(consumer main.cpp)
          target_compile_features(consumer PRIVATE cxx_std_17)
          target_link_libraries(consumer PRIVATE Corundum::corundum)
          EOF
          cat > "$RUNNER_TEMP/consumer/main.cpp" <<'EOF'
          #include <corundum/corundum.hpp>
          int main() {
              corundum::create("/crd-ci-consumer", 4096, 0600, CRD_CREATE_REPLACE);
              corundum::Writer w("/crd-ci-consumer");
              corundum::Reader r("/crd-ci-consumer");
              w.try_write(1, 42);
              corundum::Message m;
              bool ok = r.try_read(m) && *m.as<int>() == 42;
              corundum::unlink("/crd-ci-consumer");
              return ok ? 0 : 1;
          }
          EOF
          cmake -S "$RUNNER_TEMP/consumer" -B "$RUNNER_TEMP/consumer/build" -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/prefix"
          cmake --build "$RUNNER_TEMP/consumer/build"
          "$RUNNER_TEMP/consumer/build/consumer"

  windows:
    name: windows / mingw-w64 gcc
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-make
      - name: Configure
        run: cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCORUNDUM_WERROR=ON
      - name: Build
        run: cmake --build build -j4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Benchmark (shared VM, informational)
        run: ./build/corundum-bench.exe all -n 200000

  sanitizers:
    name: sanitizers / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - name: Check (gcc -Werror, clang ASan + UBSan)
        run: bash scripts/check.sh
